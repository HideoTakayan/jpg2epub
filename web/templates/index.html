<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Chuyển đổi ảnh thành file ePub, CBZ, PDF chuyên nghiệp."/>
  <title>Images → ePub / PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<div class="app" id="app">

  <!-- ══ HEADER ══════════════════════════════════════════════════ -->
  <header class="header">
    <div class="logo">
      <div class="logo-mark">📚</div>
      <div class="logo-text">
        <span class="logo-title">Images → ePub / PDF</span>
        <span class="logo-sub">Chuyển đổi ảnh thành sách điện tử chuyên nghiệp</span>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Chuyển giao diện sáng/tối">
      <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </header>

  <!-- ══ MAIN ════════════════════════════════════════════════════ -->
  <main class="main">

    <!-- LEFT: Drop Zone + Preview -->
    <section class="panel left-panel">

      <!-- Drop Zone -->
      <div class="drop-zone" id="dropZone">
        <div class="drop-inner">
          <div class="drop-illustration">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
          </div>
          <h2 class="drop-title">Kéo &amp; thả ảnh vào đây</h2>
          <p class="drop-hint">Hỗ trợ định dạng: JPG · PNG · WEBP · BMP · TIFF</p>
          <div class="drop-actions">
            <button class="btn btn-primary" id="btnAddImages">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Chọn ảnh…
            </button>
            <button class="btn btn-outline" id="btnAddFolder">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
              Chọn thư mục…
            </button>
          </div>
        </div>
      </div>
      <input type="file" id="inputImages" multiple accept=".jpg,.jpeg,.png,.webp,.bmp,.tiff,.tif,.gif" hidden/>
      <input type="file" id="inputFolder" webkitdirectory multiple hidden/>

      <!-- Preview section -->
      <div class="preview-section" id="previewSection" style="display:none">
        <div class="preview-header">
          <span class="preview-count" id="imageCount">0 ảnh</span>
          <div class="preview-actions">
            <span class="hint-drag">✦ Kéo để sắp xếp</span>
            <button class="btn btn-ghost btn-sm" id="btnSortAZ" title="Tự động sắp xếp theo thứ tự A-Z của tên file">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6L5 3L2 6M5 3V21" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Sắp xếp A-Z
            </button>
            <button class="btn btn-ghost btn-sm" id="btnClear">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
              Xóa tất cả
            </button>
          </div>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

    </section>

    <!-- RIGHT: Settings + Convert -->
    <aside class="panel right-panel">
      <h2 class="panel-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Cài đặt
      </h2>



      <!-- Format -->
      <div class="form-group">
        <label class="form-label" for="formatToggle">Định dạng xuất</label>
        <div class="format-toggle" id="formatToggle">
          <button class="format-btn active" data-format="epub" id="fmtEpub">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
            ePub
          </button>
          <button class="format-btn" data-format="pdf" id="fmtPdf">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            PDF
          </button>
          <button class="format-btn" data-format="cbz" id="fmtCbz">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M12 4v16" stroke-opacity="0.3"/></svg>
            CBZ
          </button>
        </div>
      </div>

      <!-- PDF Settings (Hidden by default since EPUB is default) -->
      <div id="pdfSettings" style="display: none; margin-top: 1rem;">
        <div class="form-group">
          <label class="form-label" for="pageSize">Khổ giấy</label>
          <select id="pageSize" class="form-select" style="width: 100%; padding: 0.5rem; border-radius: 4px; background: var(--surface2); color: var(--text); border: 1px solid var(--border);">
            <option value="fit" selected>Vừa khít ảnh (Mặc định)</option>
            <option value="a4">A4 (210 x 297 mm)</option>
            <option value="letter">US Letter (8.5 x 11")</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="pdfMargin">Căn lề</label>
          <select id="pdfMargin" class="form-select" style="width: 100%; padding: 0.5rem; border-radius: 4px; background: var(--surface2); color: var(--text); border: 1px solid var(--border);">
            <option value="0" selected>Không lề (Tràn viền)</option>
            <option value="20">Lề nhỏ</option>
            <option value="50">Lề lớn</option>
          </select>
        </div>
      </div>

      <!-- Quality slider -->
      <div class="form-group">
        <label class="form-label" for="quality">
          Chất lượng ảnh
          <span class="quality-badge" id="qualityBadge">100%</span>
        </label>
        <input type="range" id="quality" class="slider" min="10" max="100" value="100"/>
        <div class="slider-labels"><span>Nhẹ hơn</span><span>Chất lượng cao</span></div>
      </div>

      <!-- Max dimensions -->
      <div class="form-row">
        <div class="form-group form-group-half">
          <label class="form-label" for="maxWidth">Max W (px)</label>
          <input type="number" id="maxWidth" class="form-input" placeholder="Không giới hạn" min="100"/>
        </div>
        <div class="form-group form-group-half">
          <label class="form-label" for="maxHeight">Max H (px)</label>
          <input type="number" id="maxHeight" class="form-input" placeholder="Không giới hạn" min="100"/>
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="checkbox-group">
        <label class="checkbox-label" for="grayscale">
          <input type="checkbox" id="grayscale" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">Ảnh đen trắng (Grayscale)</span>
        </label>
        <label class="checkbox-label" for="autoCrop">
          <input type="checkbox" id="autoCrop" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">✂️ Tự động xén lề trắng (Auto Crop)</span>
        </label>
        <label class="checkbox-label" for="splitSpreads">
          <input type="checkbox" id="splitSpreads" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">📱 Cắt trang đôi (Split Spreads)</span>
        </label>
        <label class="checkbox-label" id="mangaRow" for="rtl">
          <input type="checkbox" id="rtl" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">🇯🇵 Manga Mode (RTL, cắt phải sang trái)</span>
        </label>
        <label class="checkbox-label" for="binarize">
          <input type="checkbox" id="binarize" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">✨ Khử nhiễu & tối ưu chữ (Binarize)</span>
        </label>
        <label class="checkbox-label" id="webpRow" for="useWebp">
          <input type="checkbox" id="useWebp" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">🗜️ Nén ảnh WebP (Giảm 50% dung lượng)</span>
        </label>
        <label class="checkbox-label" id="ocrRow" for="useOcr" style="display:none">
          <input type="checkbox" id="useOcr" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">🔍 PDF Searchable (Sử dụng OCR)</span>
        </label>
        
        <div class="checkbox-divider" style="margin: 1rem 0; border-bottom: 1px solid var(--border); width: 100%;"></div>
        <p style="font-size: 0.8rem; color: var(--text-muted); width: 100%; margin-bottom: 0.5rem; font-weight: 600;">Tính năng AI & Computer Vision (Tốn CPU):</p>
        
        <label class="checkbox-label" for="aiUpscale">
          <input type="checkbox" id="aiUpscale" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">🤖 AI Upscale x2 (Tăng nét cực mạnh)</span>
        </label>
        <label class="checkbox-label" for="deskewCrop">
          <input type="checkbox" id="deskewCrop" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">📐 Nắn thẳng ảnh & Cắt lề thông minh</span>
        </label>
        <label class="checkbox-label" for="guidedView">
          <input type="checkbox" id="guidedView" class="checkbox-input"/>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">📱 Cắt khung truyện (Guided View Mobile)</span>
        </label>
      </div>

      <!-- Convert button -->
      <button class="btn btn-convert" id="btnConvert" disabled>
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span id="convertLabel">Tạo file</span>
      </button>

      <!-- Progress -->
      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Đang xử lý…</p>
      </div>

      <!-- Log -->
      <div class="log" id="logBox"></div>
    </aside>

  </main>
</div>

<!-- CDN libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="/static/app.js"></script>

</body>
</html>
